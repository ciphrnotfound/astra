[package]
name = "astra-cli"
 version = "0.1.0"
 edition = "2021"
 default-run = "astra-cli"
 
 [dependencies]
astra-core = { path = "../core" }
anyhow = "1.0.95"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
tokio = { version = "1.0", features = ["sync", "macros", "rt-multi-thread", "time"] }
